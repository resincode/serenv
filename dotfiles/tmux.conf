# ══════════════════════════════════════════════════════════════════════════════
#  ~/.tmux.conf — remote work setup
#  Prefix: Ctrl+a  |  Plugin manager: TPM  |  Theme: Catppuccin Mocha
# ══════════════════════════════════════════════════════════════════════════════

# ─── Prefix ───────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ─── Core ─────────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g set-clipboard on          # OSC52 -> clipboard terminal lokal (remote/headless)
set -as terminal-features ',*:hyperlinks'   # OSC 8 -> tautan bisa diklik di terminal lokal
set -sg escape-time 10          # fix nvim/vim ESC delay over SSH
set -g history-limit 50000
set -g display-time 3000
set -g status-interval 5
set -g focus-events on          # autoread in vim/nvim
setw -g aggressive-resize on
set -g mouse on

# ─── Numbering ────────────────────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on      # close window 2 → window 3 becomes 2

# ─── Reload config ────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "  Config reloaded!"

# ─── Splits (keep cwd) ────────────────────────────────────────────────────────
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window      -c "#{pane_current_path}"

# ─── Pane navigation (vim-style) ──────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Without prefix (Alt + hjkl)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# ─── Pane resize (repeatable) ─────────────────────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ─── Window navigation ────────────────────────────────────────────────────────
bind -n M-Left  previous-window
bind -n M-Right next-window
bind -n M-,     previous-window
bind -n M-.     next-window

# ─── Session management ───────────────────────────────────────────────────────
bind S choose-session
bind N new-session

# ─── Copy mode (vi) ───────────────────────────────────────────────────────────
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v     send -X begin-selection
bind -T copy-mode-vi C-v   send -X rectangle-toggle
bind -T copy-mode-vi y     send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H     send -X start-of-line
bind -T copy-mode-vi L     send -X end-of-line

# ─── Plugins ──────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
# Remote/headless: jangan pipe ke xclip (tak ada X display);
# OSC52 ditangani tmux via set-clipboard on.
set -g @override_copy_command 'cat'
set -g @plugin 'catppuccin/tmux#v2.1.2'
set -g @plugin 'alexwforsythe/tmux-which-key'

# ─── Plugin: resurrect ────────────────────────────────────────────────────────
# Disabled capture-pane-contents: prevents tmux-3.3a crash in cmd_capture_pane_exec during auto-save
set -g @resurrect-capture-pane-contents 'off'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-strategy-vim  'session'

# ─── Plugin: continuum ────────────────────────────────────────────────────────
set -g @continuum-restore       'on'
set -g @continuum-save-interval '15'

# ─── Plugin: catppuccin (v2.x) ────────────────────────────────────────────────
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text          " #W"
set -g @catppuccin_window_current_text  " #W#{?window_zoomed_flag,  ,}"

# Status bar — top, catppuccin modules
set -g status-position top
set -g status-justify  centre
set -g status-left-length  150
set -g status-right-length 150
set -g status-left  "#{E:@catppuccin_status_session}#{E:@catppuccin_status_application}#{E:@catppuccin_status_directory}#{E:@catppuccin_status_uptime}"
set -g status-right "#{E:@catppuccin_status_load}#{E:@catppuccin_status_ram}#{E:@catppuccin_status_disk}"

# ─── Catppuccin modules configuration ─────────────────────────────────────────
set -g @catppuccin_session_text     " #S · #(whoami)@#H"

set -g @catppuccin_application_icon " "
set -g @catppuccin_application_color "#{E:@thm_maroon}"

set -g @catppuccin_directory_text   "#{b:pane_current_path}"
set -g @catppuccin_load_icon        "󰊚 "
set -g @catppuccin_load_color       "#{E:@thm_peach}"
set -g @catppuccin_load_text        " #(~/.local/bin/status-vitals cpu)"

# RAM gap to container limit
set -g @catppuccin_ram_icon         "󰘚 "
set -g @catppuccin_ram_color        "#cba6f7"
set -g @catppuccin_ram_text         " #(~/.local/bin/status-vitals ram)"
set -g @catppuccin_status_ram       "#[fg=#cba6f7]#[fg=#11111b,bg=#cba6f7]󰘚 #[fg=#cdd6f4,bg=#313244]#{E:@catppuccin_ram_text}#[fg=#313244] "

# Disk gap to container storage limit
set -g @catppuccin_disk_icon        "󰋊 "
set -g @catppuccin_disk_color       "#94e2d5"
set -g @catppuccin_disk_text        " #(~/.local/bin/status-vitals disk)"
set -g @catppuccin_status_disk      "#[fg=#94e2d5]#[fg=#11111b,bg=#94e2d5]󰋊 #[fg=#cdd6f4,bg=#313244]#{E:@catppuccin_disk_text}#[fg=#313244] "

set -g @catppuccin_uptime_icon      "󰔟 "
set -g @catppuccin_uptime_color     "#{E:@thm_sapphire}"
set -g @catppuccin_uptime_text      " #(~/.local/bin/status-vitals uptime)"


# ─── Initialize TPM (must stay at bottom) ─────────────────────────────────────
run '~/.tmux/plugins/tpm/tpm'

# ─── Local overrides ──────────────────────────────────────────────────────────
if-shell "[ -f ~/.tmux.conf.local ]" "source ~/.tmux.conf.local"
